<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القراءة — المكتبة المهدوية الرقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* أنماط إضافية خاصة بصفحة القراءة فقط — تستخدم نفس متغيرات style.css */
  .reader-shell{
    max-width:1200px; margin:0 auto; padding:30px 20px 80px;
    display:grid; grid-template-columns:280px 1fr; gap:28px;
    position:relative; z-index:1;
  }
  @media (max-width:820px){ .reader-shell{grid-template-columns:1fr;} }

  .book-header{
    max-width:1200px; margin:0 auto; padding:34px 20px 0; position:relative; z-index:1;
  }
  .book-header .back-link{
    color:var(--text-gold); text-decoration:none; font-size:.88rem; font-weight:700;
    display:inline-flex; align-items:center; gap:6px; margin-bottom:16px;
  }
  .book-header .back-link:hover{ color:var(--gold-bright); }
  .book-header h1{
    font-family:'Amiri', serif; font-size:2rem; font-weight:700;
    background:linear-gradient(180deg,#fff 20%, var(--gold-secondary) 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    margin-bottom:6px;
  }
  .book-header .book-author-line{ color:var(--text-muted); font-size:.95rem; margin-bottom:24px; }

  .toc-panel{
    background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg);
    padding:18px; align-self:start; position:sticky; top:90px;
  }
  .toc-panel h3{ font-size:1rem; font-weight:800; color:var(--text-gold); margin-bottom:12px; }
  .toc-search{
    width:100%; padding:9px 12px; margin-bottom:12px; border-radius:8px;
    border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-main);
    font-family:'Cairo',sans-serif; font-size:.85rem; outline:none;
  }
  .toc-search:focus{ border-color:var(--border-gold); }
  .toc-list{ list-style:none; max-height:60vh; overflow-y:auto; }
  .toc-list li{ border-top:1px solid rgba(255,255,255,.05); }
  .toc-list li:first-child{ border-top:none; }
  .toc-list button{
    width:100%; text-align:right; background:none; border:none; cursor:pointer;
    color:var(--text-muted); font-family:'Cairo',sans-serif; font-size:.85rem;
    padding:10px 6px; line-height:1.6; transition:var(--transition-fast);
  }
  .toc-list button:hover{ color:var(--text-gold); }
  .toc-list button.active{ color:var(--gold-primary); font-weight:800; }

  .reading-panel{
    background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg);
    padding:36px 40px;
  }
  @media (max-width:600px){ .reading-panel{padding:22px 20px;} }
  .reading-panel h2{
    font-family:'Amiri', serif; font-size:1.6rem; color:var(--gold-bright);
    border-bottom:1px solid var(--border-color); padding-bottom:16px; margin-bottom:8px;
  }
  .chap-counter{ color:var(--text-muted); font-size:.85rem; margin-bottom:28px; }
  .chap-text{
    font-family:'Amiri', serif; font-size:1.25rem; line-height:2.4; color:var(--text-main);
    white-space:pre-line;
  }
  .nav-buttons{
    display:flex; justify-content:space-between; gap:12px; margin-top:38px;
    padding-top:22px; border-top:1px solid var(--border-color);
  }
  .nav-btn{
    font-family:'Cairo',sans-serif; font-size:.9rem; font-weight:800; padding:11px 22px;
    border-radius:var(--radius-sm); border:1px solid var(--border-gold); color:var(--text-gold);
    background:transparent; cursor:pointer; transition:var(--transition-fast);
  }
  .nav-btn:hover:not(:disabled){ background:var(--gold-primary); color:#0a0c0e; }
  .nav-btn:disabled{ opacity:.3; cursor:not-allowed; }

  .notice-box{
    max-width:700px; margin:60px auto; text-align:center; color:var(--text-muted);
    font-family:'Cairo',sans-serif; padding:0 20px;
  }
  .notice-box a{ color:var(--text-gold); }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container nav-content">
    <a class="brand" href="index.html">
      <div class="brand-icon">📖</div>
      <div class="brand-title">المكتبة المهدوية الرقمية</div>
    </a>
  </div>
</nav>

<div class="book-header">
  <a class="back-link" href="index.html">→ العودة إلى المكتبة</a>
  <h1 id="book-title">...</h1>
  <p class="book-author-line" id="book-author"></p>
</div>

<div id="reader-root"></div>

<footer>
  <div class="container">المكتبة المهدوية الرقمية — موقع مجاني مستضاف على GitHub Pages</div>
</footer>

<script src="reader.js"></script>
</body>
</html>
